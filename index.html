// ======================================
// SUPABASE CONFIGURATION
// ======================================

const SUPABASE_URL =
"https://kokxrkrwdsogdtookepb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KraLjOOY3GBGeNJwbo-vFQ_njFkMSTS";

const STORAGE_BUCKET = "ride-photos";
const MAX_PHOTO_SIZE = 5 * 1024 * 1024;

let bookingRideId = null;

function supabaseHeaders(extra = {}) {
return {
"apikey": SUPABASE_KEY,
...extra
};
}

// ======================================
// STORAGE PHOTO UPLOAD
// ======================================

function safeFileName(name) {
return String(name || "photo")
.replace(/[^a-zA-Z0-9._-]/g, "_");
}

async function uploadVehiclePhoto(file) {

if (!file) return null;

if (!["image/jpeg","image/png","image/webp"].includes(file.type)) {
throw new Error("Select JPG, PNG or WEBP image.");
}

if (file.size > MAX_PHOTO_SIZE) {
throw new Error("Photo must be 5 MB or smaller.");
}

const path =
`${Date.now()}-${Math.random().toString(36).slice(2)}-${safeFileName(file.name)}`;

const response = await fetch(
`${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${encodeURIComponent(path)}`,
{
method:"POST",
headers:supabaseHeaders({
"Content-Type":file.type,
"x-upsert":"false"
}),
body:file
}
);

if (!response.ok) {
throw new Error(await response.text());
}

return `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${encodeURIComponent(path)}`;
}

// ======================================
// FORM MODE
// ======================================

function setMode(mode,btn) {

document.getElementById("searchForm").style.display =
mode==="search" ? "grid" : "none";

document.getElementById("postForm").style.display =
mode==="post" ? "grid" : "none";

document.querySelectorAll(".tab").forEach(tab =>
tab.classList.remove("active")
);

btn.classList.add("active");
}

function openPost() {

setMode("post",document.querySelectorAll(".tab")[1]);

document.querySelector(".hero-card").scrollIntoView({
behavior:"smooth"
});

}

// ======================================
// POST RIDE TO SUPABASE CLOUD
// ======================================

async function postRide(e) {

e.preventDefault();

const button =
document.getElementById("publishRideButton");

const photoFile =
document.getElementById("postPhoto").files[0];

button.disabled = true;
button.textContent = "Publishing...";

try {

const vehicleImageUrl =
await uploadVehiclePhoto(photoFile);

const ride = {

from_city:
document.getElementById("postFrom").value.trim(),

to_city:
document.getElementById("postTo").value.trim(),

ride_date:
document.getElementById("postDate").value,

seats_available:
Number(document.getElementById("postSeats").value),

price_per_seat:
Number(document.getElementById("postPrice").value),

driver_name:
document.getElementById("postDriver").value.trim(),

vehicle_details:
document.getElementById("postVehicle").value.trim() || null,

vehicle_image_url:vehicleImageUrl

};

const response = await fetch(
`${SUPABASE_URL}/rest/v1/rides`,
{
method:"POST",

headers:supabaseHeaders({
"Content-Type":"application/json",
"Prefer":"return=representation"
}),

body:JSON.stringify(ride)
});

if (!response.ok) {
throw new Error(await response.text());
}

showToast("Ride successfully published to Cloud!");

document.getElementById("postForm").reset();

await renderRides();

document.getElementById("rides").scrollIntoView({
behavior:"smooth"
});

} catch(error) {

console.error(error);

showToast("Ride save failed: "+error.message);

} finally {

button.disabled = false;
button.textContent = "Publish ride";

}

}

// ======================================
// GET RIDES FROM SUPABASE
// ======================================

const response = await fetch(// ======================================
// HELPER FUNCTIONS
// ======================================

function formatDate(d) {

if(!d) return "Flexible date";

const date = new Date(d);

if(Number.isNaN(date.getTime())) {
return String(d);
}

return date.toLocaleString("en-IN",{
dateStyle:"medium",
timeStyle:"short"
});

}

function escapeHtml(s) {

return String(s ?? "").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));

}

// ======================================
// BOOKING MODAL
// ======================================

async function openBooking(id) {

try {

const rides = await getRides();

const r = rides.find(x =>
String(x.id) === String(id)
);

if(!r) {
showToast("Ride not found");
return;
}

if(Number(r.seats) < 1) {
showToast("No seats currently available");
return;
}

bookingRideId = r.id;

document.getElementById("bookingInfo").innerHTML = `

<p>
<strong>
${escapeHtml(r.from)} → ${escapeHtml(r.to)}
</strong>
</p>

<p>
${formatDate(r.date)}
· ₹${Number(r.price)||0} per seat
· ${Number(r.seats)||0} seats available
</p>

`;

document.getElementById("bookingModal")
.classList.add("show");

} catch(error) {

console.error(error);

showToast("Could not open booking: "+error.message);

}

}

// ======================================
// CLOSE BOOKING
// ======================================

function closeBooking() {

document.getElementById("bookingModal")
.classList.remove("show");

}

// ======================================
// SAVE BOOKING TO SUPABASE CLOUD
// ======================================

async function confirmBooking() {

const name =
document.getElementById("bookName").value.trim();

const phone =
document.getElementById("bookPhone").value.trim();

const button =
document.getElementById("bookingSubmit");

if(!bookingRideId) {
showToast("Please select a ride again");
return;
}

if(!name || !phone) {
showToast("Please enter name and mobile number");
return;
}

if(!/^[6-9]\d{9}$/.test(phone)) {
showToast("Enter valid 10-digit mobile number");
return;
}

button.disabled = true;
button.textContent = "Sending...";

try {

const response = await fetch(
`${SUPABASE_URL}/rest/v1/booking_requests`,
{
method:"POST",

headers:supabaseHeaders({
"Content-Type":"application/json",
"Prefer":"return=minimal"
}),

body:JSON.stringify({

ride_id:bookingRideId,

passenger_name:name,

passenger_phone:phone,

seats_requested:1,

status:"pending"

})

});

if(!response.ok) {
throw new Error(await response.text());
}

closeBooking();

document.getElementById("bookName").value = "";
document.getElementById("bookPhone").value = "";

showToast("Booking request saved to Cloud successfully!");

} catch(error) {

console.error("Cloud booking error:",error);

showToast("Booking failed: "+error.message);

} finally {

button.disabled = false;
button.textContent = "Send booking request";

}

}

// ======================================
// MY RIDES
// ======================================

async function showMyRides() {

try {

const rides = await getRides();

alert(
"RideMitra\n\n"+
"Total cloud rides: "+rides.length+
"\n\nDriver login is not yet available. "+
"Personal ride history will be added with authentication."
);

} catch(error) {

showToast("Unable to load My Rides: "+error.message);

}

}

// ======================================
// TOAST MESSAGE
// ======================================

function showToast(msg) {

const t = document.getElementById("toast");

t.textContent = msg;

t.classList.add("show");

clearTimeout(window.toastTimer);

window.toastTimer = setTimeout(()=>{
t.classList.remove("show");
},4500);

}

// ======================================
// INITIAL LOAD
// ======================================

renderRides();

</script>
